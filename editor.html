<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор сайта</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #222; color: #eee; }
  #bar button { padding: 6px 14px; cursor: pointer; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #status { font-size: 13px; opacity: .8; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="bar">
  <input type="file" id="open" accept=".html,text/html">
  <button id="save" disabled>Скачать index.html</button>
  <span id="status">Загрузка...</span>
</div>
<iframe id="frame"></iframe>

<script>
  const frame = document.getElementById('frame');
  const openInput = document.getElementById('open');
  const saveBtn = document.getElementById('save');
  const status = document.getElementById('status');

  function load(text) {
    status.textContent = 'Загрузка страницы...';
    saveBtn.disabled = true;
    frame.onload = () => {
      frame.contentDocument.designMode = 'on';   // whole page becomes editable
      saveBtn.disabled = false;
      status.textContent = 'Кликай по тексту и редактируй. Когда готово, нажми "Скачать index.html".';
    };
    frame.srcdoc = text;
  }

  // Opened from the same folder on a server (e.g. GitHub Pages): load index.html automatically.
  fetch('index.html')
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(load)
    .catch(() => { status.textContent = 'Выбери файл index.html кнопкой слева.'; });

  // Opened locally (double-click): pick the file manually.
  openInput.addEventListener('change', async () => {
    const file = openInput.files[0];
    if (file) load(await file.text());
  });

  saveBtn.addEventListener('click', () => {
    const html = '<!doctype html>\n' + frame.contentDocument.documentElement.outerHTML;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = 'index.html';
    a.click();
    status.textContent = 'Файл скачан. Замени им index.html в репозитории и закоммить.';
  });
</script>
</body>
</html>
