<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHBZ | Пейджер</title>
<style>
:root{
  --bg:#060402;--bg-p:#070502;
  --accent:#ffb300;--adim:rgba(255,179,0,.28);--alo:rgba(255,179,0,.07);
  --border:#3a2a08;--bglow:#6b4a10;--danger:#ff3030;--green:#00ff88;
  --txt:#cca85a;--tdim:#8a6a30;
  --f2:'Russo One',sans-serif;--f3:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f3);min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center}
.wrap{width:520px;max-width:94vw}
h1{font-family:var(--f2);font-size:14px;letter-spacing:3px;color:var(--accent);margin-bottom:14px;text-transform:uppercase}
.panel{border:1px solid var(--border);background:var(--bg-p);padding:16px;position:relative;margin-bottom:16px}
.panel::before{content:attr(data-tag);position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:10px;letter-spacing:2px;color:var(--accent)}
#feed{height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{border:1px solid var(--border);padding:8px 10px;font-size:12px;line-height:1.5;background:var(--alo)}
.msg .meta{color:var(--tdim);font-size:10px;letter-spacing:1px;margin-bottom:3px;display:flex;justify-content:space-between}
.msg.urgent{border-color:var(--danger);box-shadow:0 0 10px rgba(255,48,48,.15)}
.msg.urgent .meta{color:var(--danger)}
.row{display:flex;gap:8px;margin-top:10px}
input,select{background:#0a0702;border:1px solid var(--border);color:var(--txt);font-family:var(--f3);font-size:12px;padding:8px}
#txt{flex:1}
select{width:120px}
button{background:var(--alo);border:1px solid var(--accent);color:var(--accent);font-family:var(--f2);font-size:10px;letter-spacing:2px;padding:8px 14px;cursor:pointer;text-transform:uppercase}
button:hover{background:var(--adim)}
.empty{color:var(--tdim);font-size:11px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>РХБИЗ // ПЕЙДЖЕР // СЕКТОР-8</h1>
  <div class="panel" data-tag="ЖУРНАЛ ВЫЗОВОВ">
    <div id="feed"><div class="empty">Нет сообщений</div></div>
  </div>
  <div class="panel" data-tag="ОТПРАВИТЬ">
    <div class="row">
      <input id="name" placeholder="Позывной" style="width:140px">
      <select id="lvl"><option value="info">INFO</option><option value="urgent">URGENT</option></select>
    </div>
    <div class="row">
      <input id="txt" placeholder="Сообщение...">
      <button id="send">ПЕРЕДАТЬ</button>
    </div>
  </div>
</div>

<script>
/* Автономный пейджер: хранит сообщения в localStorage, синхронизируется между
   открытыми вкладками/окнами через BroadcastChannel. Никакого сервера не требует.
   Чтобы подключить реальную рассылку (например, в Discord-канал), достаточно
   в функции broadcastToServer() сделать fetch на свой вебхук/бэкенд. */
const KEY='rhbz_pager_messages';
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('rhbz_pager') : null;
const feed = document.getElementById('feed');

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
function save(list){ localStorage.setItem(KEY, JSON.stringify(list.slice(-100))); }

function render(){
  const list = load();
  feed.innerHTML = '';
  if(!list.length){ feed.innerHTML = '<div class="empty">Нет сообщений</div>'; return; }
  list.slice().reverse().forEach(m=>{
    const div = document.createElement('div');
    div.className = 'msg' + (m.lvl==='urgent' ? ' urgent' : '');
    const t = new Date(m.ts).toLocaleTimeString('ru-RU');
    div.innerHTML = `<div class="meta"><span>${m.name}</span><span>${m.lvl.toUpperCase()} · ${t}</span></div><div>${m.text}</div>`;
    feed.appendChild(div);
  });
  feed.scrollTop = 0;
}

function addMessage(name, lvl, text){
  const list = load();
  const msg = { name: name||'НЕИЗВЕСТНО', lvl, text, ts: Date.now() };
  list.push(msg);
  save(list);
  render();
  if(bc) bc.postMessage({type:'new', msg});
  broadcastToServer(msg);
}

// Заглушка под реальную интеграцию (вебхук/бэкенд/бот Silicium)
function broadcastToServer(msg){
  // fetch('/api/pager', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(msg)});
}

document.getElementById('send').onclick = ()=>{
  const txt = document.getElementById('txt').value.trim();
  if(!txt) return;
  addMessage(document.getElementById('name').value.trim(), document.getElementById('lvl').value, txt);
  document.getElementById('txt').value = '';
};
document.getElementById('txt').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('send').click(); });

if(bc) bc.onmessage = (e)=>{ if(e.data && e.data.type==='new') render(); };
window.addEventListener('storage', e=>{ if(e.key===KEY) render(); });

render();
</script>
</body>
</html>
